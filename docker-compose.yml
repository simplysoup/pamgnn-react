services:
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    logging:
      driver: none

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - '55800:3000'
    env_file:
      - .env.docker
    depends_on:
      mailhog:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./public/media:/app/public/media
